<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroFlow | Restaurant Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i data-lucide="utensils" class="logo-icon"></i>
                    <span>GastroFlow</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="active" data-module="dashboard">
                        <i data-lucide="layout-dashboard"></i>
                        <span>Dashboard</span>
                    </li>
                    <li data-module="menu">
                        <i data-lucide="menu"></i>
                        <span>Menu Management</span>
                    </li>
                    <li data-module="orders">
                        <i data-lucide="shopping-cart"></i>
                        <span>Orders</span>
                    </li>
                    <li data-module="inventory">
                        <i data-lucide="package"></i>
                        <span>Inventory</span>
                    </li>
                    <li data-module="reports">
                        <i data-lucide="bar-chart-2"></i>
                        <span>Reports</span>
                    </li>
                    <li data-module="admin">
                        <i data-lucide="settings"></i>
                        <span>Admin Panel</span>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=6366f1&color=fff" alt="User">
                    <div class="user-info">
                        <span class="user-name">Admin User</span>
                        <span class="user-role">Manager</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                    <h1 id="page-title">Dashboard</h1>
                    <p id="page-subtitle">Welcome back! Here's what's happening today.</p>
                </div>
                <div class="header-right">
                    <div class="search-bar">
                        <i data-lucide="search"></i>
                        <input type="text" placeholder="Search anything...">
                    </div>
                    <button id="new-order-btn" class="btn btn-primary">
                        <i data-lucide="plus"></i>
                        <span>New Order</span>
                    </button>
                </div>
            </header>

            <section id="module-container" class="module-container">
                <!-- Modules will be injected here via JavaScript -->
            </section>
        </main>
    </div>

    <!-- Order Modal Overlay -->
    <div id="order-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Order</h2>
                <div id="close-modal" class="close-modal"><i data-lucide="x"></i></div>
            </div>
            <form id="new-order-form">
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" placeholder="Enter name" required>
                </div>
                <div class="form-group">
                    <label>Items</label>
                    <textarea placeholder="e.g. 2x Burger, 1x Cola" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Table Number</label>
                    <select>
                        <option>Table 1</option>
                        <option>Table 2</option>
                        <option>Table 3</option>
                        <option>Table 4</option>
                        <option>Table 5</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="cancel-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Order</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Menu Item Modal Overlay -->
    <div id="menu-item-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Menu Item</h2>
                <div id="close-menu-modal" class="close-modal"><i data-lucide="x"></i></div>
            </div>
            <form id="new-menu-item-form">
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" placeholder="Enter item name" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select required>
                        <option value="Main Course">Main Course</option>
                        <option value="Starters">Starters</option>
                        <option value="Beverages">Beverages</option>
                        <option value="Desserts">Desserts</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price</label>
                    <input type="text" placeholder="e.g. $12.99" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select required>
                        <option value="Active">Active</option>
                        <option value="Out of Stock">Out of Stock</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="cancel-menu-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Stock Modal Overlay -->
    <div id="add-stock-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Stock to Inventory</h2>
                <div id="close-stock-modal" class="close-modal"><i data-lucide="x"></i></div>
            </div>
            <form id="add-stock-form">
                <div class="form-group">
                    <label>Ingredient Name</label>
                    <select id="stock-ingredient" required>
                        <option value="Chicken Breast">Chicken Breast</option>
                        <option value="Tomatoes">Tomatoes</option>
                        <option value="Burger Buns">Burger Buns</option>
                        <option value="Onions">Onions</option>
                        <option value="Lettuce">Lettuce</option>
                        <option value="Potato">Potato</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Quantity to Add</label>
                    <input type="number" placeholder="Enter quantity" required>
                </div>
                <div class="form-group">
                    <label>Unit</label>
                    <input type="text" id="stock-unit" value="kg" readonly>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="cancel-stock-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Stock</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
